version: "3.9"

services:
  db:
    image: postgres:15
    container_name: sigae_db
    environment:
      POSTGRES_USER: sigae_user
      POSTGRES_PASSWORD: sigae_secret
      POSTGRES_DB: sigae_db
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
