<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#006d2c" />
  <link rel="manifest" href="./manifest.json" />
  <title>Aeropuerto Nuquí | Registro Offline</title>
  <style>
    :root { --green:#006d2c; --black:#111; --white:#fff; }
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin:0; background:#f7f7f7; color:var(--black); }
    .app { max-width: 820px; margin:0 auto; padding:14px; }
    h1,h2 { margin: 8px 0 14px; }
    .card { background:#fff; border:2px solid #111; border-radius:12px; padding:14px; margin-bottom:14px; }
    .hidden { display:none !important; }
    label { display:block; font-weight:700; margin-top:8px; margin-bottom:4px; font-size:18px; }
    input,select,textarea,button { width:100%; border-radius:10px; border:2px solid #111; font-size:20px; padding:12px; }
    button { min-height:60px; font-weight:800; cursor:pointer; background:#fff; }
    .btn-green { background:var(--green); color:var(--white); border-color:var(--green); }
    .btn-black { background:#111; color:#fff; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .small { font-size:16px; }
    .counter { font-size:22px; font-weight:900; margin:8px 0; }
    .list-item { border:2px solid #111; border-radius:10px; padding:10px; margin-bottom:8px; background:#fff; }
    .pill { display:inline-block; background:#111; color:#fff; border-radius:999px; padding:4px 10px; font-size:14px; }
    #reader { width:100%; min-height:260px; border:2px dashed #111; border-radius:12px; overflow:hidden; background:#e9e9e9; }
    @media (max-width:640px){ .row{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <main class="app">
    <h1>Aeropuerto Nuquí - Manifiesto Offline</h1>

    <section id="screenFlight" class="card">
      <h2>Pantalla de vuelo</h2>
      <label>Aerolínea</label>
      <select id="airline" required>
        <option value="">Seleccione</option>
        <option>Searca</option>
        <option>San Germán</option>
        <option>Charter</option>
      </select>
      <label>Origen</label>
      <select id="origin" required>
        <option value="">Seleccione</option>
        <option>Medellín EOH</option>
        <option>Quibdó</option>
      </select>
      <label>Número de vuelo</label>
      <input id="flightNumber" maxlength="20" />
      <div style="margin-top:12px"><button id="startFlight" class="btn-black">INICIAR REGISTRO</button></div>
    </section>

    <section id="screenOps" class="hidden">
      <div class="card">
        <div id="flightHeader" class="small"></div>
        <div id="counter" class="counter">Vuelo actual: 0 pasajeros registrados</div>
        <button id="scanBtn" class="btn-green">ESCANEAR PASAJERO</button>
        <div style="margin-top:8px"><button id="openHistory" class="btn-black">VER HISTORIAL</button></div>
      </div>

      <div id="scanCard" class="card hidden">
        <h2>Escáner</h2>
        <div id="reader"></div>
        <p class="small" id="scanStatus">Listo para escanear cédula PDF417 o texto MRZ.</p>
        <button id="stopScan" class="btn-black">DETENER CÁMARA</button>
      </div>

      <div id="confirmCard" class="card hidden">
        <h2>Confirmación de pasajero</h2>
        <div class="row">
          <div><label>Tipo documento</label><select id="docType"><option>Cédula</option><option>Pasaporte</option></select></div>
          <div><label>Número documento</label><input id="docNumber" /></div>
        </div>
        <div class="row">
          <div><label>Apellidos</label><input id="lastName" /></div>
          <div><label>Nombres</label><input id="firstName" /></div>
        </div>
        <div class="row">
          <div><label>Nacionalidad</label><input id="nationality" value="COL" /></div>
          <div><label>Sexo</label><select id="sex"><option value="">N/D</option><option>M</option><option>F</option></select></div>
        </div>
        <div class="row">
          <div><label>Fecha nacimiento</label><input id="birthDate" placeholder="YYYY-MM-DD" /></div>
          <div><label>Edad (auto)</label><input id="age" readonly /></div>
        </div>
        <label>Motivo viaje</label>
        <select id="travelReason"><option>Turismo</option><option>Residente</option><option>Trabajo</option></select>
        <label>Observaciones</label>
        <textarea id="notes" rows="3"></textarea>
        <div class="row" style="margin-top:10px">
          <button id="savePassenger" class="btn-green">GUARDAR PASAJERO</button>
          <button id="cancelPassenger" class="btn-black">CANCELAR</button>
        </div>
      </div>

      <div class="card">
        <h2>Manifiesto del vuelo</h2>
        <div id="manifest"></div>
        <button id="closeFlight" class="btn-black">CERRAR VUELO Y GENERAR REPORTE</button>
      </div>
    </section>

    <section id="screenHistory" class="card hidden">
      <h2>Historial de vuelos</h2>
      <input id="historySearch" placeholder="Buscar por fecha (YYYY-MM-DD) o documento" />
      <div style="margin-top:8px" id="historyList"></div>
      <button id="backToOps" class="btn-black">VOLVER AL VUELO ACTUAL</button>
    </section>
  </main>

  <script src="./vendor/html5-qrcode.min.js"></script>
  <script src="./vendor/zxing.min.js"></script>
  <script src="./vendor/dexie.min.js"></script>
  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./vendor/xlsx.full.min.js"></script>
  <script>
    const db = new Dexie('nuquiOfflineDB');
    db.version(1).stores({
      flights: '++id,createdAt,flightNumber,status',
      passengers: '++id,flightId,docNumber,createdAt'
    });

    const state = { currentFlightId: null, passengers: [], scanner: null, editingId: null };
    const $ = (id) => document.getElementById(id);

    const setScreen = (ops=false, history=false) => {
      $('screenOps').classList.toggle('hidden', !ops);
      $('screenHistory').classList.toggle('hidden', !history);
    };

    const safe = (v='') => String(v || '').trim();
    const toDate = (raw) => {
      const v = safe(raw).replace(/[^0-9]/g, '');
      if (v.length === 8) {
        const y = +v.slice(0,4), m = +v.slice(4,6), d = +v.slice(6,8);
        if (y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31) return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      }
      return safe(raw);
    };
    const calcAge = (birth) => {
      const dt = new Date(birth);
      if (Number.isNaN(dt.getTime())) return '';
      const now = new Date();
      let age = now.getFullYear() - dt.getFullYear();
      const m = now.getMonth() - dt.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < dt.getDate())) age--;
      return age >= 0 ? String(age) : '';
    };

    const parseCedulaPdf417 = (raw) => {
      const text = safe(raw).replace(/\r/g,'\n');
      const tokens = text.split(/[@\n|;]/).map(s=>s.trim()).filter(Boolean);
      const doc = tokens.find(t => /^\d{6,12}$/.test(t)) || '';
      const dateToken = tokens.find(t => /^(19|20)\d{2}[01]\d[0-3]\d$/.test(t)) || '';
      const sex = tokens.find(t => /^(M|F)$/i.test(t))?.toUpperCase() || '';
      const idxDoc = tokens.indexOf(doc);
      const lastName = idxDoc >= 0 ? (tokens[idxDoc+1] || '') : '';
      const firstName = idxDoc >= 0 ? (tokens[idxDoc+2] || '') : '';
      if (!doc) return null;
      return { docType:'Cédula', docNumber:doc, lastName, firstName, birthDate:toDate(dateToken), sex, nationality:'COL' };
    };

    const parseMRZ = (raw) => {
      const lines = safe(raw).replace(/\s+/g,'').match(/.{1,44}/g) || [];
      if (lines.length < 2 || !/^P</.test(lines[0])) return null;
      const l1 = lines[0].padEnd(44,'<');
      const l2 = lines[1].padEnd(44,'<');
      const nationality = l2.slice(10,13).replace(/</g,'') || 'N/D';
      const docNumber = l2.slice(0,9).replace(/</g,'');
      const namesChunk = l1.slice(5).split('<<');
      const lastName = (namesChunk[0] || '').replace(/</g,' ').trim();
      const firstName = (namesChunk[1] || '').replace(/</g,' ').trim();
      if (!docNumber) return null;
      return { docType:'Pasaporte', docNumber, lastName, firstName, birthDate:'', sex:'', nationality };
    };

    const parseScanResult = (raw) => parseCedulaPdf417(raw) || parseMRZ(raw);

    const fillForm = (data={}) => {
      $('docType').value = data.docType || 'Cédula';
      $('docNumber').value = data.docNumber || '';
      $('lastName').value = data.lastName || '';
      $('firstName').value = data.firstName || '';
      $('nationality').value = data.nationality || 'COL';
      $('sex').value = data.sex || '';
      $('birthDate').value = data.birthDate || '';
      $('age').value = calcAge(data.birthDate);
      $('travelReason').value = data.travelReason || 'Turismo';
      $('notes').value = data.notes || '';
      $('confirmCard').classList.remove('hidden');
    };

    const clearForm = () => {
      state.editingId = null;
      fillForm({ docType:'Cédula', nationality:'COL', travelReason:'Turismo' });
      $('confirmCard').classList.add('hidden');
    };

    const updateCounter = () => $('counter').textContent = `Vuelo actual: ${state.passengers.length} pasajeros registrados`;

    const renderManifest = () => {
      const list = $('manifest');
      list.innerHTML = state.passengers.length ? '' : '<p class="small">Sin pasajeros registrados aún.</p>';
      state.passengers.forEach((p) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div><strong>${safe(p.lastName)} ${safe(p.firstName)}</strong> <span class="pill">${safe(p.docType)}</span></div>
          <div>Doc: ${safe(p.docNumber)} | Nacionalidad: ${safe(p.nationality)} | Edad: ${safe(p.age) || 'N/D'}</div>
          <div>Motivo: ${safe(p.travelReason)} ${p.notes ? '| Obs: '+safe(p.notes) : ''}</div>
          <div class="row" style="margin-top:8px">
            <button data-edit="${p.id}">EDITAR</button>
            <button data-delete="${p.id}" class="btn-black">BORRAR</button>
          </div>`;
        list.appendChild(item);
      });
    };

    const refreshPassengers = async () => {
      state.passengers = await db.passengers.where('flightId').equals(state.currentFlightId).sortBy('createdAt');
      updateCounter();
      renderManifest();
    };

    const getCurrentFlight = async () => db.flights.get(state.currentFlightId);

    const exportPDF = async (flightId) => {
      const flight = await db.flights.get(flightId);
      const pax = await db.passengers.where('flightId').equals(flightId).sortBy('createdAt');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'pt', format:'a4' });
      let y = 40;
      doc.setFontSize(16); doc.text('Aeropuerto Nuquí - Manifiesto de Pasajeros', 40, y); y += 24;
      doc.setFontSize(11);
      doc.text(`Fecha: ${new Date(flight.createdAt).toLocaleString('es-CO')}`, 40, y); y += 16;
      doc.text(`Vuelo: ${flight.airline} | ${flight.origin} | ${flight.flightNumber}`, 40, y); y += 22;
      doc.text('Nombre | Doc | Nacionalidad | Edad | Motivo', 40, y); y += 12;
      doc.line(40, y, 555, y); y += 16;
      pax.forEach((p, idx) => {
        if (y > 770) { doc.addPage(); y = 40; }
        const row = `${idx+1}. ${p.lastName} ${p.firstName} | ${p.docNumber} | ${p.nationality} | ${p.age || 'N/D'} | ${p.travelReason}`;
        doc.text(row.substring(0,120), 40, y); y += 16;
      });
      doc.save(`manifiesto_${flight.flightNumber}_${new Date(flight.createdAt).toISOString().slice(0,10)}.pdf`);
    };

    const exportXLSX = async (flightId) => {
      const flight = await db.flights.get(flightId);
      const pax = await db.passengers.where('flightId').equals(flightId).sortBy('createdAt');
      const rows = pax.map((p) => ({
        Nombre: `${p.lastName} ${p.firstName}`.trim(),
        Documento: p.docNumber,
        Nacionalidad: p.nationality,
        Edad: p.age || '',
        Motivo: p.travelReason,
        Observaciones: p.notes || ''
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Manifiesto');
      XLSX.writeFile(wb, `manifiesto_${flight.flightNumber}_${new Date(flight.createdAt).toISOString().slice(0,10)}.xlsx`);
    };

    const renderHistory = async () => {
      const query = safe($('historySearch').value).toLowerCase();
      const flights = (await db.flights.orderBy('createdAt').reverse().toArray()).filter(Boolean);
      const list = $('historyList');
      list.innerHTML = '';
      for (const fl of flights) {
        const pax = await db.passengers.where('flightId').equals(fl.id).toArray();
        const match = !query || fl.flightNumber.toLowerCase().includes(query) || new Date(fl.createdAt).toISOString().slice(0,10).includes(query) || pax.some(p => safe(p.docNumber).includes(query));
        if (!match) continue;
        const el = document.createElement('div');
        el.className = 'list-item';
        el.innerHTML = `
          <div><strong>${fl.airline} - ${fl.flightNumber}</strong></div>
          <div>${fl.origin} | ${new Date(fl.createdAt).toLocaleString('es-CO')} | ${pax.length} pasajeros</div>
          <div class="row" style="margin-top:8px">
            <button data-pdf="${fl.id}" class="btn-green">Descargar PDF</button>
            <button data-xlsx="${fl.id}" class="btn-black">Descargar Excel</button>
          </div>`;
        list.appendChild(el);
      }
      if (!list.children.length) list.innerHTML = '<p class="small">No hay vuelos guardados.</p>';
    };

    const stopScanner = async () => {
      if (state.scanner) {
        try { await state.scanner.stop(); } catch (_) {}
        try { await state.scanner.clear(); } catch (_) {}
        state.scanner = null;
      }
      $('scanCard').classList.add('hidden');
    };

    $('birthDate').addEventListener('input', () => $('age').value = calcAge($('birthDate').value));

    $('startFlight').addEventListener('click', async () => {
      const airline = safe($('airline').value), origin = safe($('origin').value), flightNumber = safe($('flightNumber').value);
      if (!airline || !origin || !flightNumber) return alert('Complete aerolínea, origen y número de vuelo.');
      const id = await db.flights.add({ airline, origin, flightNumber, createdAt: new Date().toISOString(), status:'open' });
      state.currentFlightId = id;
      $('flightHeader').textContent = `Vuelo activo: ${airline} | ${origin} | ${flightNumber}`;
      $('screenFlight').classList.add('hidden');
      setScreen(true, false);
      await refreshPassengers();
    });

    $('scanBtn').addEventListener('click', async () => {
      if (!state.currentFlightId) return;
      await stopScanner();
      $('scanCard').classList.remove('hidden');
      $('scanStatus').textContent = 'Abriendo cámara trasera...';
      state.scanner = new Html5Qrcode('reader');
      const formats = [Html5QrcodeSupportedFormats.PDF_417, Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.QR_CODE];
      await state.scanner.start({ facingMode: { exact: 'environment' } }, { fps: 10, qrbox: { width: 320, height: 200 }, formatsToSupport: formats }, async (decodedText) => {
        const result = parseScanResult(decodedText);
        if (!result) {
          $('scanStatus').textContent = 'Lectura detectada pero no reconocida. Intente de nuevo o ingrese MRZ manualmente.';
          return;
        }
        $('scanStatus').textContent = 'Documento leído correctamente.';
        await stopScanner();
        fillForm(result);
      }, () => {} ).catch(async () => {
        await state.scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 320, height: 200 }, formatsToSupport: formats }, async (decodedText) => {
          const result = parseScanResult(decodedText);
          if (!result) return;
          await stopScanner();
          fillForm(result);
        });
      });
    });

    $('stopScan').addEventListener('click', stopScanner);

    $('cancelPassenger').addEventListener('click', clearForm);

    $('savePassenger').addEventListener('click', async () => {
      const payload = {
        flightId: state.currentFlightId,
        docType: safe($('docType').value),
        docNumber: safe($('docNumber').value),
        lastName: safe($('lastName').value),
        firstName: safe($('firstName').value),
        nationality: safe($('nationality').value) || 'N/D',
        sex: safe($('sex').value),
        birthDate: safe($('birthDate').value),
        age: calcAge($('birthDate').value),
        travelReason: safe($('travelReason').value) || 'Turismo',
        notes: safe($('notes').value),
        createdAt: new Date().toISOString()
      };
      if (!payload.docNumber || !payload.firstName) return alert('Complete mínimo número de documento y nombres.');
      if (state.editingId) await db.passengers.update(state.editingId, payload);
      else await db.passengers.add(payload);
      clearForm();
      await refreshPassengers();
    });

    $('manifest').addEventListener('click', async (e) => {
      const editId = e.target.getAttribute('data-edit');
      const deleteId = e.target.getAttribute('data-delete');
      if (editId) {
        const p = await db.passengers.get(Number(editId));
        state.editingId = p.id;
        fillForm(p);
      }
      if (deleteId && confirm('¿Borrar pasajero?')) {
        await db.passengers.delete(Number(deleteId));
        await refreshPassengers();
      }
    });

    $('closeFlight').addEventListener('click', async () => {
      if (!state.currentFlightId) return;
      await db.flights.update(state.currentFlightId, { status:'closed', closedAt:new Date().toISOString() });
      await exportPDF(state.currentFlightId);
      await exportXLSX(state.currentFlightId);
      alert('Vuelo cerrado y reportes generados localmente.');
      await renderHistory();
    });

    $('openHistory').addEventListener('click', async () => { setScreen(false, true); await renderHistory(); });
    $('backToOps').addEventListener('click', () => setScreen(true, false));
    $('historySearch').addEventListener('input', renderHistory);

    $('historyList').addEventListener('click', async (e) => {
      const pdfId = e.target.getAttribute('data-pdf');
      const xlsxId = e.target.getAttribute('data-xlsx');
      if (pdfId) await exportPDF(Number(pdfId));
      if (xlsxId) await exportXLSX(Number(xlsxId));
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }

    if (window.ZXing) {
      console.log('ZXing cargado offline:', !!ZXing.BarcodeFormat);
    }
  </script>
</body>
</html>
